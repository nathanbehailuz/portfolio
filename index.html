<script>
// Load experiences from JSON and populate the experience section
async function loadExperiences() {
    try {
        const response = await fetch('experiences.json');
        const data = await response.json();
        const experiences = data.experiences || [];

        // Filter for top_pick experiences
        const topPickExperiences = experiences.filter(exp => exp.top_pick === true);

        // Get container element
        const container = document.getElementById('experience-container');
        if (!container) return;

        // Clear existing content
        container.innerHTML = '';

        // Create experience elements
        topPickExperiences.forEach((exp, index) => {
            // Create group div for hover effects
            const groupDiv = document.createElement('div');
            groupDiv.className = 'relative group experience-item';
            groupDiv.setAttribute('data-accent', exp.titleColor || 'text-primary');

            // Create timeline indicator
            const timelineDiv = document.createElement('div');
            timelineDiv.className = 'timeline-dot absolute -left-[21px] top-1 w-[10px] h-[10px] bg-background border border-border-subtle rounded-full';
            groupDiv.appendChild(timelineDiv);

            // Create experience content
            const contentDiv = document.createElement('div');
            contentDiv.className = 'flex flex-col mb-2 gap-1';

            const titleRow = document.createElement('div');
            titleRow.className = 'flex w-full justify-between items-baseline gap-4';

            const titleH3 = document.createElement('h3');
            titleH3.className = `font-body-md text-body-md font-semibold ${exp.titleColor || 'text-primary'}`;
            titleH3.textContent = exp.title;
            titleRow.appendChild(titleH3);

            const datesSpan = document.createElement('span');
            datesSpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant shrink-0 text-right';
            datesSpan.textContent = `${exp.start_date} – ${exp.end_date || 'Present'}`;
            titleRow.appendChild(datesSpan);

            const companyRow = document.createElement('div');
            companyRow.className = 'flex w-full justify-between items-baseline gap-4';

            const companySpan = document.createElement('span');
            companySpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant';
            companySpan.textContent = exp.company_name;
            companyRow.appendChild(companySpan);

            if (exp.location) {
                const locationSpan = document.createElement('span');
                locationSpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant shrink-0 text-right';
                locationSpan.textContent = exp.location;
                companyRow.appendChild(locationSpan);
            }

            contentDiv.appendChild(titleRow);
            contentDiv.appendChild(companyRow);
            groupDiv.appendChild(contentDiv);

            // Description (first bullet point only)
            if (exp.description && exp.description.length > 0) {
                const descP = document.createElement('p');
                descP.className = 'experience-desc font-body-md text-body-md text-on-surface-variant pl-4 border-l';
                descP.textContent = exp.description[0]; // Only first bullet point
                groupDiv.appendChild(descP);
            }

            // Add to container with spacing (except for first item)
            if (index > 0) {
                const spacer = document.createElement('div');
                spacer.className = 'mb-8';
                container.appendChild(spacer);
            }
            container.appendChild(groupDiv);
        });
    } catch (error) {
        console.error('Error loading experiences:', error);
        // Fallback to static content if JSON loading fails
        loadFallbackExperiences();
    }
}

// Fallback function in case JSON loading fails
function loadFallbackExperiences() {
    const container = document.getElementById('experience-container');
    if (!container) return;

    // Static fallback experiences (same as before but filtered)
    const fallbackExperiences = [
        {

        const groupDiv = document.createElement('div');

        const timelineDiv = document.createElement('div');
        timelineDiv.className = 'timeline-dot absolute -left-[21px] top-1 w-[10px] h-[10px] bg-background border border-border-subtle rounded-full';
        groupDiv.appendChild(timelineDiv);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'flex flex-col mb-2 gap-1';

        const titleRow = document.createElement('div');
        titleRow.className = 'flex w-full justify-between items-baseline gap-4';

        const titleH3 = document.createElement('h3');
        titleH3.className = `font-body-md text-body-md font-semibold ${exp.titleColor || 'text-primary'}`;
        titleH3.textContent = exp.title;
        titleRow.appendChild(titleH3);

        const datesSpan = document.createElement('span');
        datesSpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant shrink-0 text-right';
        datesSpan.textContent = `${exp.start_date} – ${exp.end_date}`;
        titleRow.appendChild(datesSpan);

        const companyRow = document.createElement('div');
        companyRow.className = 'flex w-full justify-between items-baseline gap-4';

        const companySpan = document.createElement('span');
        companySpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant';
        companySpan.textContent = exp.company_name;
        companyRow.appendChild(companySpan);

        if (exp.location) {
            const locationSpan = document.createElement('span');
            locationSpan.className = 'font-mono-sm text-mono-sm text-on-surface-variant shrink-0 text-right';
            locationSpan.textContent = exp.location;
            companyRow.appendChild(locationSpan);
        }

        contentDiv.appendChild(titleRow);
        contentDiv.appendChild(companyRow);
        groupDiv.appendChild(contentDiv);

        const descP = document.createElement('p');
        descP.className = 'experience-desc font-body-md text-body-md text-on-surface-variant pl-4 border-l';
        descP.textContent = exp.description[0];
        groupDiv.appendChild(descP);

        container.appendChild(groupDiv);
    });
}

// Load experiences when page loads
document.addEventListener('DOMContentLoaded', loadExperiences);
</script>

<script>
async function loadProjects() {
    try {
        const response = await fetch('projects.json');
        const data = await response.json();
        const projects = (data.projects || []).filter((project) => project.top_pick === true);

        const container = document.getElementById('projects-container');
        if (!container) return;

        container.innerHTML = '';

        projects.forEach((project) => {
            const card = document.createElement('a');
            card.href = `projects.html#${project.id}`;
            card.className = 'project-preview block p-6 border border-border-subtle bg-surface-container-lowest hover:bg-surface-elevated transition-colors group';

            const title = document.createElement('h3');
            title.className = `font-body-md text-body-md font-semibold mb-3 flex items-center gap-2 transition-colors ${project.titleColor || 'text-primary'}`;

            if (project.icon) {
                const icon = document.createElement('i');
                icon.className = `${project.icon} ${project.iconColor || ''}`;
                title.appendChild(icon);
            }

            const name = document.createElement('span');
            name.textContent = project.name;
            title.appendChild(name);

            const arrow = document.createElement('span');
            arrow.className = 'material-symbols-outlined text-[16px] opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all ml-auto';
            arrow.textContent = 'arrow_outward';
            title.appendChild(arrow);

            card.appendChild(title);

            if (project.description && project.description.length > 0) {
                const desc = document.createElement('p');
                desc.className = 'font-body-md text-body-md text-on-surface-variant text-sm';
                desc.textContent = project.description[0];
                card.appendChild(desc);
            }

            container.appendChild(card);
        });
    } catch (error) {
        console.error('Error loading projects:', error);
    }
}

document.addEventListener('DOMContentLoaded', loadProjects);
</script>
