<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nathan Behailu - Projects</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="projects-styles.css"/>
</head>
<body class="bg-[#111111] text-[#E0E0E0]">
    <div class="min-h-screen flex flex-col">
        <header class="w-full fixed top-0 left-0 bg-[#111111] z-10 transition-colors duration-300" id="header">
            <nav class="flex justify-end items-center text-sm px-6 sm:px-8 py-6">
                <div class="flex items-center space-x-4">
                    <div class="space-x-4">
                        <a class="hover:text-cyan-400 transition-colors text-gray-300" href="index.html">Home</a>
                        <a class="hover:text-emerald-400 transition-colors text-gray-300" href="#projects">Projects</a>
                        <a class="hover:text-amber-400 transition-colors text-gray-300" href="#resume">Resume</a>
                    </div>
                    <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-lg bg-gradient-to-r from-gray-700 to-gray-600 hover:from-gray-600 hover:to-gray-500 transition-all duration-300 shadow-lg ml-4">
                        <i class="fas fa-sun text-yellow-400" id="theme-icon"></i>
                    </button>
                </div>
            </nav>
        </header>
        
        <div class="flex flex-grow container mx-auto px-6 sm:px-8 pt-24">
            <aside class="w-1/4 pt-2">
                <div class="sticky top-24">
                    <div class="mb-6">
                        <img src="images/pp.JPG" alt="Nathan Profile Picture" class="w-16 h-16 rounded-lg object-cover border-2 border-cyan-400 mb-2 shadow-lg shadow-cyan-400/20"/>
                        <h1 class="text-xl font-bold text-white">Nathan Behailu</h1>
                    </div>
                    <ul class="space-y-3 text-sm text-[#A0A0A0]">
                        <li><a class="hover:text-white flex items-center space-x-2 group" href="#"><i class="fas fa-university w-4 text-blue-400 group-hover:text-blue-300"></i><span>New York University</span></a></li>
                        <li><a class="hover:text-white flex items-center space-x-2 group" href="mailto:nz2212@nyu.edu"><i class="fas fa-envelope w-4 text-yellow-400 group-hover:text-yellow-300"></i><span>nz2212@nyu.edu</span></a></li>
                        <li><a class="hover:text-white flex items-center space-x-2 group" href="https://www.linkedin.com/in/nathan-behailu/"><i class="fab fa-linkedin w-4 text-blue-500 group-hover:text-blue-400"></i><span>LinkedIn</span></a></li>
                        <li><a class="hover:text-white flex items-center space-x-2 group" href="https://github.com/nathanbehailuz"><i class="fab fa-github w-4 text-gray-300 group-hover:text-white"></i><span>GitHub</span></a></li>
                        <li><a class="hover:text-white flex items-center space-x-2 group" href="https://www.instagram.com/natebehailu/"><i class="fab fa-instagram w-4 text-pink-500 group-hover:text-pink-400"></i><span>Instagram</span></a></li>
                    </ul>
                </div>
            </aside>
            
            <main class="w-3/4 py-10 pl-4 pr-16">
                <div class="max-w-6xl mx-auto">
                    <section id="projects">
                        <div class="mb-8">
                            <h2 class="text-2xl font-bold text-white mb-2 flex items-center">
                                <i class="fas fa-folder-open text-emerald-400 mr-3"></i>Projects
                            </h2>
                            <p class="text-sm text-[#A0A0A0]">Filter projects by category to explore my work.</p>
                        </div>

                        <!-- Filter Tabs -->
                        <div class="mb-8">
                            <div class="flex flex-wrap items-center gap-4">
                                <button class="filter-btn active" data-filter="all">
                                    <i class="fas fa-th-large mr-2"></i>All
                                </button>
                                <button class="filter-btn" data-filter="websites">
                                    <i class="fas fa-globe mr-2"></i>Websites
                                </button>
                                <button class="filter-btn" data-filter="ml">
                                    <i class="fas fa-brain mr-2"></i>Machine Learning
                                </button>
                                <button class="filter-btn" data-filter="mobile">
                                    <i class="fas fa-mobile-alt mr-2"></i>Mobile Apps
                                </button>
                                <button class="filter-btn" data-filter="finance">
                                    <i class="fas fa-chart-line mr-2"></i>Finance
                                </button>
                            </div>
                        </div>

                        <!-- Projects Grid -->
                        <div id="projectsGrid" class="space-y-6">
                            <!-- Projects will be dynamically loaded here -->
                        </div>
                    </section>
                </div>
            </main>
        </div>
        
        <footer class="w-full mt-16 p-6 sm:p-8">
            <div class="container mx-auto text-center text-xs text-gray-600">
                <p>© 2025 Nathan Behailu. All Rights Reserved.</p>
                <p class="mt-2">Design inspired by <a href="https://musicforprogramming.net/latest/" target="_blank" rel="noopener noreferrer" class="hover:text-gray-400 transition-colors">musicforprogramming.net</a></p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="projects.js"></script>
</body>
</html>
